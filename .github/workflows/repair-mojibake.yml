name: Repair mojibake

on:
  push:
    branches:
      - feature/profiling-display
    paths:
      - .github/workflows/repair-mojibake.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'fix: restore UTF-8 text'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/profiling-display
          fetch-depth: 0

      - name: Fetch develop
        run: git fetch origin develop:refs/remotes/origin/develop

      - name: Repair encoding-only corruption
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import re
          import subprocess
          from pathlib import Path

          BASE = "origin/develop"
          suspicious_tokens = (
              "馃",
              "鈥�", "鈥?",
              "閳�", "閳?",
              "鈫�", "鈫?",
              "鈹�", "鈹?", "鈹€",
              "棣冪", "棣冩",
              "娌￠敊",
              "濞岋",
              "锛孌",
              "鐜板湪",
              "浼氳",
              "閿涳拷",
          )

          def run(*args: str, check: bool = True) -> subprocess.CompletedProcess[str]:
              return subprocess.run(args, check=check, text=True, capture_output=True)

          def corrupted_variants(text: str) -> set[str]:
              variants: set[str] = set()
              current = text
              for _ in range(2):
                  try:
                      current = current.encode("utf-8").decode("gbk", errors="replace")
                  except Exception:
                      break
                  variants.add(current)
                  variants.add(current.replace("\ufffd", "?"))
              variants.discard(text)
              variants.discard("")
              return variants

          changed = run("git", "diff", "--name-only", f"{BASE}...HEAD").stdout.splitlines()
          repaired_files: list[str] = []

          for name in changed:
              path = Path(name)
              if not path.is_file():
                  continue
              raw = path.read_bytes()
              if b"\x00" in raw:
                  continue
              try:
                  current = raw.decode("utf-8")
              except UnicodeDecodeError:
                  continue

              base_result = run("git", "show", f"{BASE}:{name}", check=False)
              if base_result.returncode != 0:
                  continue
              base = base_result.stdout

              full_line_map: dict[str, str] = {}
              fragment_map: dict[str, str] = {}

              for base_line in base.splitlines(keepends=True):
                  body = base_line.rstrip("\r\n")
                  ending = base_line[len(body):]
                  if any(ord(ch) > 127 for ch in body):
                      for bad in corrupted_variants(body):
                          full_line_map[bad + ending] = base_line

                      for fragment in re.findall(r"[^\x00-\x7f]+", body):
                          for bad in corrupted_variants(fragment):
                              if len(bad) >= 2:
                                  fragment_map[bad] = fragment

              new_lines: list[str] = []
              changed_file = False
              ordered_fragments = sorted(fragment_map.items(), key=lambda item: len(item[0]), reverse=True)
              for line in current.splitlines(keepends=True):
                  replacement = full_line_map.get(line)
                  if replacement is not None:
                      if replacement != line:
                          changed_file = True
                      new_lines.append(replacement)
                      continue

                  repaired = line
                  for bad, good in ordered_fragments:
                      if bad in repaired:
                          repaired = repaired.replace(bad, good)
                  if repaired != line:
                      changed_file = True
                  new_lines.append(repaired)

              if changed_file:
                  path.write_text("".join(new_lines), encoding="utf-8", newline="")
                  repaired_files.append(name)

          residual: list[str] = []
          for name in changed:
              path = Path(name)
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              hits = [token for token in suspicious_tokens if token in text]
              if hits:
                  residual.append(f"{name}: {', '.join(hits)}")

          print("Repaired files:")
          for name in repaired_files:
              print(f"  {name}")

          if residual:
              print("Residual suspicious sequences:")
              for item in residual:
                  print(f"  {item}")
              raise SystemExit(1)
          PY

      - name: Validate diff
        run: |
          git diff --check
          git diff --stat origin/develop...HEAD
          git diff --stat

      - name: Commit repaired text
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-mojibake.yml
          git add -A
          git commit -m "fix: restore UTF-8 text"
          git push origin HEAD:feature/profiling-display
