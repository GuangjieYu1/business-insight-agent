name: Assemble Phase 0 branch

on:
  workflow_dispatch:
  push:
    branches:
      - agent/phase-0-bootstrap
    paths:
      - .github/workflows/assemble-phase0.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-0-bootstrap
          fetch-depth: 0

      - name: Assemble full Data Formulator source with Phase 0 changes
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_SHA="00d0f5e1655e2a5bb02fda289f73960bbac62027"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/microsoft/data-formulator.git
          git fetch upstream main
          git fetch origin agent/phase-0-bootstrap
          git checkout -B agent/phase-0-assembled "$UPSTREAM_SHA"
          git checkout origin/agent/phase-0-bootstrap -- \
            .gitignore \
            docs/architecture \
            docs/testing/BASELINE_TEST_REPORT.md \
            py-src/data_formulator/product.py \
            py-src/data_formulator/insight \
            tests/insight \
            patches/phase0/app.py.patch
          git apply patches/phase0/app.py.patch
          git add -A
          git commit -m "feat: bootstrap business insight agent on Data Formulator"

      - name: Run Phase 0 tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "pydantic>=2" flask pytest
          PYTHONPATH=py-src pytest -q tests/insight

      - name: Push assembled branch
        shell: bash
        run: git push origin agent/phase-0-assembled --force
